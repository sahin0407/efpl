<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — EFPL</title>
  <style>
    body {
      background-color: #111111;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .logo {
      font-family: serif;
      font-style: italic;
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .offline {
      color: #888888;
      margin-bottom: 0.5rem;
    }
    .slogan {
      color: #C8A84B;
      font-size: 0.875rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    button {
      background: transparent;
      border: 1px solid #C8A84B;
      color: #C8A84B;
      padding: 0.75rem 2rem;
      font-size: 0.875rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: bold;
      cursor: pointer;
      border-radius: 2px;
    }
    button:hover {
      background: #C8A84B;
      color: #111111;
    }
  </style>
</head>
<body>
  <div class="logo">EFPL</div>
  <div class="offline">You are offline</div>
  <div class="slogan">More Than A Match</div>
  <button onclick="window.location.reload()">Retry</button>
</body>
</html>
